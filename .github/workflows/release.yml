name: Release

# Push a tag such as v0.1.0 to publish a release with the built game attached,
# or run this workflow by hand with the tag name and it creates the tag on the commit it runs from.
#
# Two jobs keep write access away from installed packages. The build job installs, tests and builds
# with read-only access. Only the publish job can write to the repo, and it runs no package code:
# it downloads the built files and creates the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.1.0"
        required: true

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes. A stuck download fails here instead of holding the release for hours.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag must look like v1.2.3" >&2; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8
      - run: npm run test:e2e
      - name: Write the release notes from the changelog
        run: awk -v v="${TAG#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/sankofa-snake.js
            dist/sankofa-snake.css
            dist/sankofa-logo.svg
            dist/index.html
            dist/SHA256SUMS
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the files against SHA256SUMS
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag must look like v1.2.3" >&2; exit 1 ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Sankofa Snake $TAG" \
            --notes-file release-notes.md \
            dist/sankofa-snake.js dist/sankofa-snake.css dist/sankofa-logo.svg dist/index.html dist/SHA256SUMS
