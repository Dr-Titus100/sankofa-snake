<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The game makes no network requests, so this page allows none. The build fills in the style hash. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'STYLE_HASH'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Sankofa Snake</title>
    <meta name="description" content="A free snake game in kente colors, with the Sankofa bird as its logo." />
    <link rel="icon" href="sankofa-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="sankofa-snake.css" />
    <style>
      body { margin: 0; padding: 16px; min-height: 100vh; background: #0f0b0c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .page-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <h1 class="page-title">Sankofa Snake</h1>
    <main>
      <div data-sankofa-snake></div>
    </main>
    <script type="module" src="sankofa-snake.js"></script>
  </body>
</html>
